<!DOCTYPE html> 
<html>
<head>
  <meta charset="UTF-8">
  <title>Solitaire Login</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div class="login-container">
    <h1>Welcome to Solitaire!</h1>
    <input type="text" id="name" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <div>
      <button class="buttonn" id="loginBtn">Login</button>
      <button class="buttonn" id="registerBtn">Register</button>
      <button class="buttonn" onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
    </div>
    <p id="message"></p>
  </div>
  <script src="main.js"></script>
</body>
</html>
